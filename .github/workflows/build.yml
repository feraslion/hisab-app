name: Build Hisab App (Desktop & Mobile)

on:
  push:
    branches: [ "main" ]

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Build Windows Installer
        run: npx electron-builder --win
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-windows
          path: dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: npm ci
      - run: npm run build
      - name: Setup Android Environment
        run: |
          npm install -g @capacitor/cli @capacitor/android
          npx cap init "Hisab App" com.hisab.app
          npx cap add android
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: hisab-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
